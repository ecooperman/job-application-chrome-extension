<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <title>Jobs</title>
    <link rel="stylesheet" href="popup.css" />
  </head>
  <body>
    <h1>Jobs</h1>
    <div id="update-banner" class="update-banner hidden" role="status"></div>
    <p id="jobs-hint" class="hint">Reads the job posting on this page and adds it to your Jobs list, where it is scored against your resume.</p>
    <button id="score-btn">Send this job to Jobs</button>
    <button id="score-listing-btn" class="hidden">Send all jobs on this page to Jobs</button>
    <p id="score-status" class="status"></p>

    <p class="hint section-gap">Applying for a job? This fills in the fields on this page from your saved profile. It never submits anything - always review before you click submit.</p>
    <button id="fill-btn" class="secondary">Fill this page</button>
    <p id="fill-status" class="status"></p>

    <button id="export-profile-btn" class="secondary hidden">Export LinkedIn profile</button>
    <p id="export-profile-status" class="status"></p>

    <a href="#" id="options-link">Edit profile &amp; settings</a>
    <script src="../lib/version.js"></script>
    <script src="popup.js"></script>
  </body>
</html>
