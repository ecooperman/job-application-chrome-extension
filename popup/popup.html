<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <title>Job Application Autofill</title>
    <link rel="stylesheet" href="popup.css" />
  </head>
  <body>
    <h1>Job Application Autofill</h1>
    <p class="hint">Fills in fields on this page from your saved profile. It never submits anything - always review before you click submit.</p>
    <button id="fill-btn">Fill this page</button>
    <p id="fill-status" class="status"></p>

    <button id="score-btn" class="secondary">Score this job</button>
    <button id="score-listing-btn" class="secondary hidden">Score all jobs on this page</button>
    <p id="score-status" class="status"></p>

    <a href="#" id="options-link">Edit profile &amp; settings</a>
    <script src="popup.js"></script>
  </body>
</html>
